plugins { id 'com.android.application' }

android {
    namespace 'io.github.wangrunqiao0915.folioread'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.wangrunqiao0915.folioread'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-test'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'boolean', 'GOOGLE_DRIVE_ENABLED', providers.gradleProperty('enableGoogleDrive').getOrElse('true')
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release { minifyEnabled false }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.assets.srcDirs = [layout.buildDirectory.dir('generated/folioAssets')]
    testOptions { animationsDisabled = true }
}

tasks.register('prepareFolioAssets', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'scripts/build_android_assets.py', '--output', layout.buildDirectory.dir('generated/folioAssets').get().asFile.absolutePath
    inputs.dir '../../easyread/web'
    inputs.dir '../web'
    inputs.file '../../scripts/build_android_assets.py'
    outputs.dir layout.buildDirectory.dir('generated/folioAssets')
}
tasks.named('preBuild').configure { dependsOn 'prepareFolioAssets' }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
