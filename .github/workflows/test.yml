# 每次推送和 PR：在 Windows / macOS / Linux 上装一遍、跑单元测试、真的启动一次服务看页面能不能打开。
name: test
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: utf-8
      EASYREAD_LIBRARY: ${{ github.workspace }}/ci-library
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装（非 editable，顺便检查网页文件打进了包）
        run: python -m pip install .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 单元测试
        run: python -m unittest discover tests -v
      - name: 前端回归检查
        run: |
          node tests/test_chat_export.cjs
          node tests/test_markup_links.cjs
          node tests/test_reference_import.cjs
          node tests/test_local_settings.cjs
          node tests/test_mobile.cjs
          node tests/test_mobile_drive.cjs
          node tests/test_mobile_folder_import.cjs
          node tests/test_android_drive.cjs
          node tests/test_citations.cjs
          node tests/test_bibliography.cjs
          node tests/test_outline.cjs
          node tests/test_mobile_knowledge.cjs
          node tests/test_mobile_organization.cjs
          node tests/test_mobile_organization_drive.cjs
          node tests/test_mobile_organization_ui.cjs
          node tests/test_mobile_naming.cjs
      - name: 启动服务，打开文献库页
        run: |
          cd "$RUNNER_TEMP"
          python -m easyread serve --port 8799 > serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8799/ -o page.html && break; sleep 1; done
          cat serve.log
          grep -q "Folio Read" page.html
          curl -sf http://127.0.0.1:8799/web/js/common/confirm.js -o /dev/null
          curl -sf http://127.0.0.1:8799/web/css/base.css -o /dev/null
          for file in app detail help import settings-library sidebar; do curl -sf "http://127.0.0.1:8799/web/js/library/$file.js" -o /dev/null || exit 1; done
          echo OK

  browser-chromium:
    # Use the installed package and a synthetic PDF; no user data or model keys.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install application and pinned Playwright
        run: |
          python -m pip install .
          npm install --prefix "$RUNNER_TEMP/folio-playwright" --no-save --package-lock=false playwright@1.58.2 jsdom@26.1.0
          "$RUNNER_TEMP/folio-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Chromium UI regression
        env:
          PLAYWRIGHT: ${{ runner.temp }}/folio-playwright/node_modules/playwright
          BROWSER_ARTIFACTS: ${{ runner.temp }}/folio-browser-artifacts
        run: node tests/test_browser.cjs
      - name: Classification DOM regression
        env:
          JSDOM: ${{ runner.temp }}/folio-playwright/node_modules/jsdom
        run: node tests/test_classification_dom.cjs
      - name: Classification Chromium regression
        env:
          PLAYWRIGHT: ${{ runner.temp }}/folio-playwright/node_modules/playwright
          BROWSER_ARTIFACTS: ${{ runner.temp }}/folio-browser-artifacts/classification
        run: node tests/test_classification_browser.cjs
      - name: Chinese naming DOM regression
        env:
          JSDOM: ${{ runner.temp }}/folio-playwright/node_modules/jsdom
        run: node tests/test_naming_dom.cjs
      - name: Chinese naming Chromium regression
        env:
          PLAYWRIGHT: ${{ runner.temp }}/folio-playwright/node_modules/playwright
          BROWSER_ARTIFACTS: ${{ runner.temp }}/folio-browser-artifacts/naming
        run: node tests/test_naming_browser.cjs
      - name: Upload Chromium screenshots, traces, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-ui-regression
          path: ${{ runner.temp }}/folio-browser-artifacts
          if-no-files-found: warn
          retention-days: 14

  start-sh:
    # macOS / Linux 的一键启动脚本
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ./start.sh
        run: |
          export EASYREAD_LIBRARY="$RUNNER_TEMP/lib"
          (./start.sh > start.log 2>&1 &)
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8766/ -o /dev/null && break; sleep 1; done
          cat start.log
          curl -sf http://127.0.0.1:8766/ | grep -q "Folio Read"
