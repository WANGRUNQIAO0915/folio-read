name: Mobile reader
on:
  push:
    branches: [main]
    paths: ['easyread/web/mobile/**', 'easyread/web/css/base.css', 'easyread/web/js/common/markup.js', 'easyread/web/js/common/organization.js', 'easyread/web/js/common/classification-editor.js', 'easyread/web/vendor/katex/**', 'scripts/build_mobile_site.py', '.github/workflows/mobile-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: mobile-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_mobile_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/mobile-site
      - uses: actions/deploy-pages@v4
        id: deployment
